project_name: 论文每日导引
timezone: Asia/Shanghai
discovery_days: 7
daily_limit: 10
raw_dir: papers/raw
zh_dir: papers/zh
database_path: papers.db
log_dir: logs

raw:
  skip_download: true

# ===== 机构过滤 — 只保留来自大厂的论文 =====
major_orgs:
  - name: OpenAI
    keywords: ["OpenAI", "openai"]
  - name: Google DeepMind
    keywords: ["Google", "DeepMind", "Alphabet"]
  - name: Anthropic
    keywords: ["Anthropic", "anthropic"]
  - name: Meta FAIR
    keywords: ["Meta", "FAIR", "Facebook"]
  - name: Microsoft
    keywords: ["Microsoft", "MSRA"]
  - name: Amazon
    keywords: ["Amazon", "AWS"]
  - name: Apple
    keywords: ["Apple"]
  - name: NVIDIA
    keywords: ["NVIDIA", "nvidia"]
  - name: 阿里通义
    keywords: ["Alibaba", "通义", "Qwen", "aliyun"]
  - name: 智谱
    keywords: ["智谱", "Zhipu", "GLM", "智谱AI"]
  - name: 百度
    keywords: ["Baidu", "百度"]
  - name: 腾讯
    keywords: ["Tencent", "腾讯"]
  - name: 华为
    keywords: ["Huawei", "华为"]
  - name: 字节跳动
    keywords: ["ByteDance", "字节跳动"]
  - name: DeepSeek
    keywords: ["DeepSeek", "深度求索"]
  - name: MiniMax
    keywords: ["MiniMax", "minimax"]

# ===== 摘要模式（替代全文翻译）=====
summary:
  enabled: true
  chunk_chars: 8000

# 导引系统 — 不做翻译，不做站点
# 每天自动发现新论文，追加到路线文件
site:
  enabled: false

git:
  auto_commit: true
  auto_push: true
  branch: main
  remote_name: origin
  commit_prefix: "auto: paper hub"

workbuddy:
  enabled: false
  jobs_dir: .workbuddy/jobs
  daily_brief_path: .workbuddy/daily-brief.md
  task_prompt_path: .workbuddy/daily-task.md
  memory_dir: .workbuddy/memory
  skill_source_dir: .workbuddy/skills/paper-learning-hub
  installed_skill_path: ~/.workbuddy/skills/paper-learning-hub
  use_symlink_install: true

themes:
  - name: 时序预测
    keywords:
      - time series
      - forecasting
      - spatiotemporal
      - temporal
      - long-term forecasting
      - trajectory prediction
      - sequence modeling
      - patch tst
      - transformer forecasting
      - informer
      - autoformer
      - timesnet
  - name: AI Agent
    keywords:
      - agent
      - agents
      - tool use
      - planning
      - reasoning
      - multi-agent
      - autonomous
      - computer use
      - language agent
      - agentic

# === 论文发现源 ===
# 两条路线（时序预测 + Agent）各配关键词搜索
# 不再按机构搜索，改为按主题搜索，覆盖更全面

organizations:
  # ============ 路线一：时序预测 ============
  - name: 时序预测-核心
    priority: 95
    aliases: ["timeseries"]
    feeds:
      - name: 时序预测 arXiv 搜索
        url: "http://export.arxiv.org/api/query?search_query=all:%22time+series+forecasting%22+AND+(cat:cs.LG+OR+cat:stat.ML+OR+cat:cs.AI)&start=0&max_results=15&sortBy=submittedDate&sortOrder=descending"
  - name: 时序预测-PatchTST/Transformer
    priority: 93
    aliases: ["transformer-ts"]
    feeds:
      - name: Transformer时序预测 arXiv 搜索
        url: "http://export.arxiv.org/api/query?search_query=all:%22transformer%22+AND+all:%22time+series%22+AND+(cat:cs.LG+OR+cat:cs.AI)&start=0&max_results=10&sortBy=submittedDate&sortOrder=descending"
  - name: 时空预测
    priority: 90
    aliases: ["spatiotemporal"]
    feeds:
      - name: 时空预测 arXiv 搜索
        url: "http://export.arxiv.org/api/query?search_query=all:%22spatiotemporal%22+OR+all:%22spatio-temporal%22+AND+(cat:cs.LG+OR+cat:cs.AI+OR+cat:stat.ML)&start=0&max_results=10&sortBy=submittedDate&sortOrder=descending"

  # ============ 路线二：AI Agent ============
  - name: AI Agent-核心
    priority: 95
    aliases: ["agent"]
    feeds:
      - name: AI Agent arXiv 搜索
        url: "http://export.arxiv.org/api/query?search_query=all:%22AI+agent%22+OR+all:%22multi-agent%22+OR+all:%22agentic%22+AND+(cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL+OR+cat:cs.MA)&start=0&max_results=15&sortBy=submittedDate&sortOrder=descending"
  - name: Agent-MultiAgent
    priority: 92
    aliases: ["multiagent"]
    feeds:
      - name: 多智能体 arXiv 搜索
        url: "http://export.arxiv.org/api/query?search_query=all:%22multi-agent%22+AND+all:%22reinforcement%22+OR+all:%22planning%22+AND+(cat:cs.MA+OR+cat:cs.AI+OR+cat:cs.LG)&start=0&max_results=10&sortBy=submittedDate&sortOrder=descending"

  # ============ 保留少量高价值机构源 ============
  - name: OpenAI
    priority: 85
    aliases: ["openai"]
    feeds:
      - name: OpenAI arXiv query
        url: "http://export.arxiv.org/api/query?search_query=all:%22OpenAI%22+AND+(cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL)&start=0&max_results=10&sortBy=submittedDate&sortOrder=descending"
  - name: Google DeepMind
    priority: 84
    aliases: ["google", "deepmind"]
    feeds:
      - name: Google DeepMind arXiv query
        url: "http://export.arxiv.org/api/query?search_query=all:%22DeepMind%22+AND+(cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL)&start=0&max_results=10&sortBy=submittedDate&sortOrder=descending"
