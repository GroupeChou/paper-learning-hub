site_name: Paper Learning Hub
site_url: https://groupechou.github.io/paper-learning-hub/
repo_name: GroupeChou/paper-learning-hub
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - navigation.tracking
plugins:
  - search
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css

nav:
  - 🏠 首页: index.md
  - 📌 今日更新: today.md
  - 🧠 AI Agent 系统: track1-agent.md
  - 📊 机器学习与推理: track2-ml.md
  - 🌐 应用与领域: track3-applied.md
  - 📖 全部论文: papers/index.md
