site_name: 论文每日导引
site_url: 
repo_name: 
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
nav:
  - 首页: index.md
  - 🤖 AI Agent 论文目录: guides/agent-roadmap.md
  - 📈 时序预测论文目录: guides/ts-roadmap.md
  - 📅 今日更新: guides/daily-guide.md
  - 📚 专题索引: topics/index.md
  - 📰 前沿AI日报: daily/index.html
  - 论文详情:
    - papers/index.md
