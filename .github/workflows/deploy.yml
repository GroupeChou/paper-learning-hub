name: Deploy MkDocs Site + Daily Reports to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material 'mkdocs-static-i18n' pillow cairosvg

      - name: Build MkDocs site
        run: |
          # Copy daily reports into MkDocs source so nav links resolve
          if [ -d docs/daily ]; then
            mkdir -p site/docs/daily
            cp docs/daily/*.html site/docs/daily/
            cp docs/daily/*.json site/docs/daily/ 2>/dev/null || true
            cp docs/daily/*.md site/docs/daily/ 2>/dev/null || true
            echo "Daily reports copied into MkDocs source"
          fi
          cd site
          mkdocs build

      - name: Inject CNAME for custom domain
        run: |
          echo "paper.groupechou.com" > site/site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
